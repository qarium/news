  metrics_hint: "plan prices and tiers, free plan limits, AI generation quality and speed, platform and file format support, integrations, version status (beta/GA)"
  # Target audience of the channel.
  audience: "product and graphic designers, design leads and UX researchers, who value new tools, working speed and AI's impact on the craft"
