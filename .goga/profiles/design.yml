  practical_events: "new design tool features and plugins, open-source alternatives (Penpot), API and auto-layout engine updates, fresh UI kits and design systems"
  # Industry resonance (the 3-point scoring criterion).
  industry_events: "acquisitions and investments in design tools (the Adobe–Figma saga), license disputes around AI model training, designer hiring trends, debates about the profession's future"
